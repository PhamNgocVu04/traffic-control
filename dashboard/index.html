<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Dashboard điều khiển giao thông</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 24px; background: #EEF3F8; color: #1D3557; }
  h1 { margin: 0 0 4px; }
  .sub { color: #555; font-size: 13px; margin-bottom: 14px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #aaa; margin-right: 4px; }
  .dot.on { background: #2A9D8F; } .dot.poll { background: #E9A424; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .card { background: #fff; border-radius: 10px; padding: 16px; min-width: 220px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .light { display: inline-block; width: 22px; height: 22px; border-radius: 50%; vertical-align: middle; margin-right: 8px; }
  .GREEN { background: #2A9D8F; } .YELLOW { background: #E9A424; } .RED { background: #C0392B; }
  button { padding: 8px 14px; margin: 4px 4px 0 0; cursor: pointer; }
  #alerts { display: none; background: #C0392B; color: #fff; border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; font-weight: bold; }
  .chart { flex: 1; min-width: 420px; }
  .chart canvas { width: 100% !important; height: 220px !important; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td { padding: 4px 6px; border-bottom: 1px solid #eee; vertical-align: top; }
  td.time { white-space: nowrap; color: #555; }
  tr.CONGESTION_ALERT td { color: #C0392B; font-weight: bold; }
  .logbox { max-height: 240px; overflow: auto; }
  .cams { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 16px; }
  .cams figure { margin: 0; background: #fff; border-radius: 10px; padding: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .cams img { width: 100%; border-radius: 6px; background: #ccc; min-height: 120px; }
  .cams figcaption { font-weight: bold; margin-top: 6px; }
</style>
</head>
<body>
<h1>Dashboard điều khiển giao thông</h1>
<div class="sub"><span id="conn-dot" class="dot"></span><span id="conn">Đang kết nối...</span> · Giờ Việt Nam: <b id="clock">-</b></div>
<div id="alerts"></div>

<div class="row">
  <div class="card"><h3>Chế độ</h3><p id="mode">-</p>
    <button onclick="setMode('AUTO')">Auto</button>
    <button onclick="setMode('MANUAL')">Manual</button></div>
  <div class="card"><h3>Đèn tín hiệu</h3><div id="lights">-</div>
    <p id="timer" style="font-size:22px;font-weight:bold;margin:6px 0">-</p>
    <p id="dens" style="font-size:13px;color:#555;margin:0">-</p></div>
  <div class="card"><h3>Ép pha (Manual)</h3>
    <button onclick="force('North-South')">Xanh Bắc - Nam</button>
    <button onclick="force('East-West')">Xanh Đông - Tây</button>
    <p id="msg"></p></div>
  <div class="card chart"><h3>Lưu lượng 10 phút gần nhất (mật độ PCU)</h3><canvas id="chart"></canvas></div>
</div>

<div class="cams">
  <figure><img src="/api/stream/North" alt="Camera Bắc"><figcaption>Camera hướng Bắc · <span id="cnt-North">-</span></figcaption></figure>
  <figure><img src="/api/stream/East" alt="Camera Đông"><figcaption>Camera hướng Đông · <span id="cnt-East">-</span></figcaption></figure>
  <figure><img src="/api/stream/South" alt="Camera Nam"><figcaption>Camera hướng Nam · <span id="cnt-South">-</span></figcaption></figure>
  <figure><img src="/api/stream/West" alt="Camera Tây"><figcaption>Camera hướng Tây · <span id="cnt-West">-</span></figcaption></figure>
</div>
<div class="card" style="margin-top:16px"><h3>Nhật ký</h3><div class="logbox"><table id="logs"></table></div></div>

<script>
const TEN = {North: 'Bắc', South: 'Nam', East: 'Đông', West: 'Tây', 'North-South': 'Bắc - Nam', 'East-West': 'Đông - Tây'};
// Doi gio UTC tu server sang gio Viet Nam
const gioVN = iso => iso ? new Date(iso).toLocaleString('vi-VN', {timeZone: 'Asia/Ho_Chi_Minh', hour12: false}) : '-';
const gioNgan = iso => new Date(iso).toLocaleTimeString('vi-VN', {timeZone: 'Asia/Ho_Chi_Minh', hour12: false});

// ---------- hien thi 1 goi du lieu (dung chung cho WebSocket va du phong) ----------
function hienThi(d) {
  const s = d.status;
  document.getElementById('mode').textContent = s.mode;
  document.getElementById('lights').innerHTML = Object.entries(s.lights)
    .map(([k, v]) => `<p><span class="light ${v}"></span>${TEN[k] || k}: ${v}</p>`).join('');
  document.getElementById('timer').textContent = s.remaining_seconds !== null
    ? `Còn ${s.remaining_seconds} giây` : (s.mode === 'MANUAL' ? 'Manual: giữ pha' : '-');
  document.getElementById('dens').textContent = s.fallback
    ? 'Không đủ số liệu camera → xanh cố định'
    : (s.density ? `Mật độ Bắc-Nam ${s.density['North-South']} · Đông-Tây ${s.density['East-West']} → xanh ${s.green_duration}s` : '');
  for (const dir of ['North', 'East', 'South', 'West']) {
    const c = (d.counts || {})[dir];
    document.getElementById('cnt-' + dir).textContent = c
      ? `${c.total} xe (ô tô ${c.car}, xe máy ${c.motorbike}, buýt ${c.bus}, tải ${c.truck}) · mật độ ${c.density}`
      : 'chưa có số liệu';
  }
  const box = document.getElementById('alerts');
  box.style.display = d.alerts.length ? 'block' : 'none';
  box.innerHTML = d.alerts.map(a =>
    `⚠ Ùn tắc hướng ${TEN[a.pair] || a.pair}: mật độ ${a.density} (${a.cycles} chu kỳ liên tiếp) · từ ${gioVN(a.since)}`).join('<br>');
  document.getElementById('logs').innerHTML = d.logs.map(l =>
    `<tr class="${l.action}"><td class="time">${gioVN(l.created_at)}</td><td>${l.action}</td><td>${l.details || ''}</td></tr>`).join('');
  document.getElementById('clock').textContent = gioVN(d.server_time);
}

// ---------- WebSocket: server tu day du lieu moi 1 giay ----------
let ws = null, pollTimer = null;
function trangThaiKetNoi(text, cls) {
  document.getElementById('conn').textContent = text;
  document.getElementById('conn-dot').className = 'dot ' + cls;
}
function ketNoi() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/dashboard');
  ws.onopen = () => { trangThaiKetNoi('WebSocket: thời gian thực', 'on'); clearInterval(pollTimer); pollTimer = null; };
  ws.onmessage = e => hienThi(JSON.parse(e.data));
  ws.onclose = () => {                      // mat ket noi -> tam hoi server moi giay, 3 giay sau thu noi lai
    trangThaiKetNoi('Mất WebSocket → đang hỏi lại server mỗi giây', 'poll');
    if (!pollTimer) pollTimer = setInterval(duPhong, 1000);
    setTimeout(ketNoi, 3000);
  };
}
async function duPhong() {                  // che do du phong bang REST (giong Sprint 3)
  try {
    const [status, counts, alerts, logs] = await Promise.all(
      ['/api/status', '/api/counts', '/api/alerts', '/api/logs'].map(u => fetch(u).then(r => r.json())));
    hienThi({status, counts, alerts, logs, server_time: new Date().toISOString()});
  } catch (e) { trangThaiKetNoi('Không kết nối được server', ''); }
}

// ---------- Bieu do luu luong (Chart.js), cap nhat moi 10 giay ----------
let chart = null;
const MAU = {North: '#1F77B4', South: '#2A9D8F', East: '#E9A424', West: '#C0392B'};
async function veBieuDo() {
  if (!window.Chart) return;                // khong tai duoc Chart.js (mat mang) -> bo qua bieu do
  const h = await (await fetch('/api/stats/history?minutes=10&bucket=30')).json();
  const labels = h.labels.map(gioNgan);
  const datasets = Object.entries(h.series).map(([dir, data]) => ({
    label: 'Hướng ' + TEN[dir], data, borderColor: MAU[dir], backgroundColor: MAU[dir], tension: 0.3, spanGaps: true, pointRadius: 2}));
  if (!chart) {
    chart = new Chart(document.getElementById('chart'), {type: 'line', data: {labels, datasets},
      options: {animation: false, maintainAspectRatio: false, scales: {y: {beginAtZero: true, title: {display: true, text: 'PCU'}}}}});
  } else {
    chart.data.labels = labels; chart.data.datasets = datasets; chart.update();
  }
}

// ---------- Lenh dieu khien ----------
async function setMode(mode) {
  await fetch('/api/control/mode', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({mode})});
}
async function force(pair) {
  const r = await fetch('/api/control/force-phase', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({direction_pair: pair})});
  const d = await r.json();
  document.getElementById('msg').textContent = r.ok ? 'Đã ép pha ' + (TEN[pair] || pair) : d.detail;
}

ketNoi();
veBieuDo(); setInterval(veBieuDo, 10000);
</script>
</body>
</html>
